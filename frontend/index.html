<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta id="apple-app-title" name="apple-mobile-web-app-title" content="Laundry Ops" />
    <link id="app-icon-svg" rel="icon" href="/neutral-app-icon.svg" type="image/svg+xml" />
    <link id="app-icon-png" rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link id="app-icon-apple" rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      CRITICAL for iOS Add to Home Screen:
      Do NOT put <link rel="manifest" href="/manifest.webmanifest"> in static HTML.
      Safari captures that file's start_url ("/") and home-screen opens login,
      even if a later script swaps the href. Inject only the correct manifest here.
    -->
    <script>
      (function () {
        try {
          var raw = location.pathname || "/";
          var path = String(raw).replace(/\/{2,}/g, "/");
          if (!path) path = "/";
          if (path.charAt(0) !== "/") path = "/" + path;

          if (path !== raw) {
            history.replaceState(
              null,
              "",
              path + (location.search || "") + (location.hash || "")
            );
          }

          var href = "/manifest.webmanifest";
          var appleTitle = "Laundry Ops";
          var icon = "";
          var pinSurface = false;

          if (/^\/attendance\/maintenance\/veewash\/?$/i.test(path)) {
            href = "/attendance-maintenance.manifest.webmanifest";
            appleTitle = "Checklist";
            icon = "/veewash-attendance-logo.png";
            pinSurface = true;
          } else if (/^\/attendance\/role\/veewash\/?$/i.test(path)) {
            href = "/attendance-role.manifest.webmanifest";
            appleTitle = "Switch Role";
            icon = "/veewash-attendance-logo.png";
            pinSurface = true;
          } else if (/^\/pin\/veewash\/?$/i.test(path)) {
            href = "/pin.manifest.webmanifest";
            appleTitle = "PIN Menu";
            icon = "/veewash-attendance-logo.png";
            pinSurface = true;
          } else if (/^\/attendance\/veewash\/?$/i.test(path)) {
            href = "/attendance.manifest.webmanifest";
            appleTitle = "Attendance";
            icon = "/veewash-attendance-logo.png";
            pinSurface = true;
          } else if (/^\/attendance\/maintenance\/([^/]+)\/?$/i.test(path)) {
            href = "/attendance-manifests/" + RegExp.$1.toLowerCase() + "-maintenance.webmanifest";
            appleTitle = "Checklist";
            pinSurface = true;
          } else if (/^\/attendance\/role\/([^/]+)\/?$/i.test(path)) {
            href = "/attendance-manifests/" + RegExp.$1.toLowerCase() + "-role.webmanifest";
            appleTitle = "Switch Role";
            pinSurface = true;
          } else if (/^\/pin\/([^/]+)\/?$/i.test(path)) {
            href = "/pin-manifests/" + RegExp.$1.toLowerCase() + ".webmanifest";
            appleTitle = "PIN Menu";
            pinSurface = true;
            if (RegExp.$1.toLowerCase() === "veewash") icon = "/veewash-attendance-logo.png";
          } else if (/^\/pin\/?$/i.test(path)) {
            href = "/pin-manifests/default.webmanifest";
            appleTitle = "PIN Menu";
            pinSurface = true;
          } else if (/^\/kiosk\/([^/]+)\/?$/i.test(path)) {
            href = "/kiosk-manifests/" + RegExp.$1.toLowerCase() + ".webmanifest";
            pinSurface = true;
          } else if (/^\/attendance\/([^/]+)\/?$/i.test(path)) {
            var slug = RegExp.$1.toLowerCase();
            if (slug !== "role" && slug !== "maintenance") {
              href = slug === "veewash"
                ? "/attendance.manifest.webmanifest"
                : "/attendance-manifests/" + slug + ".webmanifest";
              pinSurface = true;
              if (slug === "veewash") icon = "/veewash-attendance-logo.png";
            }
          }

          // Remember last PIN path (diagnostics / future recovery only — do not auto-redirect
          // standalone "/" here; that would break the main Laundry Ops home-screen app).
          if (/^\/pin\//i.test(path)) {
            try {
              localStorage.setItem("washpro_ios_homescreen_start", path.replace(/\/$/, "") || path);
            } catch (e) { /* ignore */ }
          }

          var link = document.createElement("link");
          link.id = "app-manifest";
          link.rel = "manifest";
          link.href = href;
          document.head.appendChild(link);

          var apple = document.getElementById("apple-app-title");
          if (apple) apple.setAttribute("content", appleTitle);
          document.title = appleTitle;

          if (icon) {
            ["app-icon-apple", "app-icon-png"].forEach(function (id) {
              var el = document.getElementById(id);
              if (el) el.setAttribute("href", icon);
            });
          }

          if (pinSurface) {
            window.__laundryOpsPinSurface = true;
          }
        } catch (e) { /* ignore */ }
      })();
    </script>
    <title>Laundry Ops</title>
    <!-- OneSignal Web SDK v16 (init + worker path in src/main.jsx) -->
    <script
      src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js"
      defer
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
