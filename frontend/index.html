<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Laundry Ops" />
    <link id="app-manifest" rel="manifest" href="/manifest.webmanifest" />
    <!--
      Override manifest BEFORE React boots so "Add to Home Screen" does not
      capture Laundry Ops (start_url / → username/password login).

      Also collapse …net//pin/… → /pin/… immediately: Safari A2HS saves the
      current URL, and //pin never matches the PIN manifest regex.
    -->
    <script>
      (function () {
        try {
          var raw = location.pathname || "/";
          var path = String(raw).replace(/\/{2,}/g, "/");
          if (!path) path = "/";
          if (path.charAt(0) !== "/") path = "/" + path;

          if (path !== raw) {
            history.replaceState(
              null,
              "",
              path + (location.search || "") + (location.hash || "")
            );
          }

          var href = "/manifest.webmanifest";
          var appleTitle = "";

          if (/^\/attendance\/maintenance\/veewash\/?$/i.test(path)) {
            href = "/attendance-maintenance.manifest.webmanifest";
            appleTitle = "Checklist";
          } else if (/^\/attendance\/role\/veewash\/?$/i.test(path)) {
            href = "/attendance-role.manifest.webmanifest";
            appleTitle = "Switch Role";
          } else if (/^\/pin\/veewash\/?$/i.test(path)) {
            href = "/pin.manifest.webmanifest";
            appleTitle = "PIN Menu";
          } else if (/^\/attendance\/veewash\/?$/i.test(path)) {
            href = "/attendance.manifest.webmanifest";
            appleTitle = "Attendance";
          } else if (/^\/attendance\/maintenance\/([^/]+)\/?$/i.test(path)) {
            href = "/attendance-manifests/" + RegExp.$1.toLowerCase() + "-maintenance.webmanifest";
            appleTitle = "Checklist";
          } else if (/^\/attendance\/role\/([^/]+)\/?$/i.test(path)) {
            href = "/attendance-manifests/" + RegExp.$1.toLowerCase() + "-role.webmanifest";
            appleTitle = "Switch Role";
          } else if (/^\/pin\/([^/]+)\/?$/i.test(path)) {
            href = "/pin-manifests/" + RegExp.$1.toLowerCase() + ".webmanifest";
            appleTitle = "PIN Menu";
          } else if (/^\/pin\/?$/i.test(path)) {
            href = "/pin-manifests/default.webmanifest";
            appleTitle = "PIN Menu";
          } else if (/^\/attendance\/([^/]+)\/?$/i.test(path)) {
            var slug = RegExp.$1.toLowerCase();
            if (slug !== "role" && slug !== "maintenance") {
              href = slug === "veewash"
                ? "/attendance.manifest.webmanifest"
                : "/attendance-manifests/" + slug + ".webmanifest";
            }
          }

          var link = document.getElementById("app-manifest") || document.querySelector('link[rel="manifest"]');
          if (link) link.setAttribute("href", href);

          if (appleTitle) {
            var apple = document.querySelector('meta[name="apple-mobile-web-app-title"]');
            if (apple) apple.setAttribute("content", appleTitle);
            document.title = appleTitle;
          }

          // Prefer org logo on home-screen icon for PIN surfaces (Safari uses apple-touch-icon).
          if (/^\/pin\//i.test(path) || /^\/attendance\//i.test(path)) {
            var icon = "/veewash-attendance-logo.png";
            if (/^\/pin\/washpro/i.test(path) || /\/washpro/i.test(path)) {
              icon = "/neutral-app-icon.svg";
            }
            ["app-icon-apple", "app-icon-png"].forEach(function (id) {
              var el = document.getElementById(id);
              if (el) el.setAttribute("href", icon);
            });
          }
        } catch (e) { /* ignore */ }
      })();
    </script>
    <link id="app-icon-svg" rel="icon" href="/neutral-app-icon.svg" type="image/svg+xml" />
    <link id="app-icon-png" rel="icon" type="image/svg+xml" sizes="192x192" href="/neutral-app-icon.svg" />
    <link id="app-icon-apple" rel="apple-touch-icon" href="/neutral-app-icon.svg" />
    <title>Laundry Ops</title>
    <!-- OneSignal Web SDK v16 (init + worker path in src/main.jsx) -->
    <script
      src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js"
      defer
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
