<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Laundry Ops" />
    <link id="app-manifest" rel="manifest" href="/manifest.webmanifest" />
    <!--
      Override manifest BEFORE React boots so "Add to Home Screen" does not
      capture Laundry Ops (start_url / → username/password login).
    -->
    <script>
      (function () {
        try {
          var p = location.pathname || "";
          var href = "/manifest.webmanifest";
          if (/^\/attendance\/maintenance\/veewash\/?$/i.test(p)) {
            href = "/attendance-maintenance.manifest.webmanifest";
          } else if (/^\/attendance\/role\/veewash\/?$/i.test(p)) {
            href = "/attendance-role.manifest.webmanifest";
          } else if (/^\/pin\/veewash\/?$/i.test(p)) {
            href = "/pin.manifest.webmanifest";
          } else if (/^\/attendance\/veewash\/?$/i.test(p)) {
            href = "/attendance.manifest.webmanifest";
          } else if (/^\/attendance\/maintenance\/([^/]+)\/?$/i.test(p)) {
            href = "/attendance-manifests/" + RegExp.$1.toLowerCase() + "-maintenance.webmanifest";
          } else if (/^\/attendance\/role\/([^/]+)\/?$/i.test(p)) {
            href = "/attendance-manifests/" + RegExp.$1.toLowerCase() + "-role.webmanifest";
          } else if (/^\/pin\/([^/]+)\/?$/i.test(p)) {
            href = "/pin-manifests/" + RegExp.$1.toLowerCase() + ".webmanifest";
          } else if (/^\/attendance\/([^/]+)\/?$/i.test(p)) {
            var slug = RegExp.$1.toLowerCase();
            if (slug !== "role" && slug !== "maintenance") {
              href = slug === "veewash"
                ? "/attendance.manifest.webmanifest"
                : "/attendance-manifests/" + slug + ".webmanifest";
            }
          }
          var link = document.getElementById("app-manifest") || document.querySelector('link[rel="manifest"]');
          if (link) link.setAttribute("href", href);
        } catch (e) { /* ignore */ }
      })();
    </script>
    <link id="app-icon-svg" rel="icon" href="/neutral-app-icon.svg" type="image/svg+xml" />
    <link id="app-icon-png" rel="icon" type="image/svg+xml" sizes="192x192" href="/neutral-app-icon.svg" />
    <link id="app-icon-apple" rel="apple-touch-icon" href="/neutral-app-icon.svg" />
    <title>Laundry Ops</title>
    <!-- OneSignal Web SDK v16 (init + worker path in src/main.jsx) -->
    <script
      src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js"
      defer
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
