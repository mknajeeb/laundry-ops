# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions
#
# If SSH shows only hostingstart.html + output.tar.zst under /home/site/wwwroot:
#   Azure → laundryops-api → Configuration → add SCM_DO_BUILD_DURING_DEPLOYMENT = false
#   so the deployed zip extracts fully (includes scripts/rinse-cleanertickets).
#   Optional: GitHub repo → Settings → Variables → AZURE_WEBAPP_RESOURCE_GROUP = your RG
#   so the deploy job sets that flag automatically via Azure CLI.

name: Build and deploy Python app to Azure Web App - laundryops-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 🛠️ Local Build Section (Optional)
      # The following section in your workflow is designed to catch build issues early on the client side, before deployment. This can be helpful for debugging and validation. However, if this step significantly increases deployment time and early detection is not critical for your workflow, you may remove this section to streamline the deployment process.
      - name: Create and Start virtual environment and Install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt

      - name: Verify files that must reach Azure
        run: |
          test -f backend/app.py
          test -f startup.sh
          test -f requirements.txt
          test -f scripts/rinse-cleanertickets/scrape.mjs
          test -f scripts/rinse-cleanertickets/scrape-vendor-home.mjs
          test -f scripts/rinse-cleanertickets/package.json
          ls -la scripts/rinse-cleanertickets/

      - name: Ensure startup.sh is executable
        run: chmod +x startup.sh

      # By default, when you enable GitHub CI/CD integration through the Azure portal, the platform automatically sets the SCM_DO_BUILD_DURING_DEPLOYMENT application setting to true. This triggers the use of Oryx, a build engine that handles application compilation and dependency installation (e.g., pip install) directly on the platform during deployment. Hence, we exclude the antenv virtual environment directory from the deployment artifact to reduce the payload size. 
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/

      # 🚫 Opting Out of Oryx Build
      # If you prefer to disable the Oryx build process during deployment, follow these steps:
      # 1. Remove the SCM_DO_BUILD_DURING_DEPLOYMENT app setting from your Azure App Service Environment variables.
      # 2. Refer to sample workflows for alternative deployment strategies: https://github.com/Azure/actions-workflow-samples/tree/master/AppService
      

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: deploy_pkg

      - name: Confirm deploy bundle after download
        run: |
          cd deploy_pkg
          pwd
          test -f backend/app.py
          test -f scripts/rinse-cleanertickets/scrape.mjs
          ls -la scripts/rinse-cleanertickets/

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2D83462BC08F44C381C6256584851BA1 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_980B3988625145B8950C00217BB86C65 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1D4160C7070D4EB49054DE2E4C8AE35C }}

      # Stops Oryx from replacing wwwroot with only build output (fixes missing scripts/).
      - name: Configure Web App for reliable zip deploy
        continue-on-error: true
        uses: azure/cli@v2
        with:
          azcliversion: 2.63.0
          inlineScript: |
            RG=$(az webapp list --query "[?name=='laundryops-api'].resourceGroup | [0]" -o tsv)
            if [ -z "$RG" ]; then
              RG="mkn_resgrp_centralus"
              echo "Falling back to resource group: $RG"
            fi
            echo "RESOURCE_GROUP=$RG" >> "$GITHUB_ENV"
            az webapp config appsettings set \
              --resource-group "$RG" \
              --name laundryops-api \
              --settings \
                SCM_DO_BUILD_DURING_DEPLOYMENT=false \
                GITHUB_SHA=${{ github.sha }} \
                BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'laundryops-api'
          package: './deploy_pkg'
          restart: true

      - name: Restart API and verify health build stamp
        continue-on-error: true
        uses: azure/cli@v2
        with:
          azcliversion: 2.63.0
          inlineScript: |
            RG="${RESOURCE_GROUP:-mkn_resgrp_centralus}"
            az webapp restart --resource-group "$RG" --name laundryops-api || true
            API="https://laundryops-api-dscucxa8c6dbghd9.centralus-01.azurewebsites.net"
            for i in 1 2 3 4 5 6; do
              sleep 15
              BODY=$(curl -sf "$API/health" || true)
              echo "health attempt $i: $BODY"
              if echo "$BODY" | grep -q "${{ github.sha }}"; then
                echo "Verified production /health reports commit ${{ github.sha }}"
                exit 0
              fi
            done
            echo "::warning::API /health did not report git_sha ${{ github.sha }} — check Azure SCM_DO_BUILD_DURING_DEPLOYMENT=false and wwwroot contents"
            exit 0
